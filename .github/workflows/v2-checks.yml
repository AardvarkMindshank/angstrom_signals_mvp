name: Signals v2 checks

# Push to the v2 development branch (or run by hand): the full check suite, with results saved to the
# reports branch (ci/v2/...) so they can be read without the Actions page. The jobs live in checks.yml.
on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      publish: true
