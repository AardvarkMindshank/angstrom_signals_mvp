name: Social post
# Posts a published daily video to the connected social channels (social_post.py), by hand: a test, or a day that
# was missed. The daily run posts by itself after the video is made (daily-video.yml).
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Video day YYYY-MM-DD (blank: the newest)"
        default: ""
      only:
        description: "Only these platforms, comma-separated (blank: all connected)"
        default: ""
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      SOCIAL_PACK_TO: angus@marketnavi.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Post
        run: python social_post.py ${{ inputs.day && format('--day {0}', inputs.day) || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
