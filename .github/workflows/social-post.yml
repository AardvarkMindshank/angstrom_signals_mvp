name: Social post
# Posts a published daily video to the connected social channels (social_post.py). Started at 08:00 Bangkok by the
# 5-minute worker (alerts.yml, with claim: each day once), or by hand for a test or a missed day.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Video day YYYY-MM-DD (blank: the newest)"
        default: ""
      only:
        description: "Only these platforms, comma-separated (blank: all connected)"
        default: ""
      claim:
        description: "Mark the day posted first, and skip it if it already was (the daily 08:00 run)"
        type: boolean
        default: false
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      SOCIAL_PACK_TO: angus@marketnavi.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Post
        run: python social_post.py ${{ inputs.day && format('--day {0}', inputs.day) || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.claim && '--claim' || '' }}
