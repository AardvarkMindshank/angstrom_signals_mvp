# The funnel job (funnel_runner.py): every active funnel, stage by stage, a few minutes after each hour so the closed
# candles have reached Binance. One claimed run per (funnel, stage, close), so overlapping jobs never repeat work.
name: funnel
on:
  schedule:
    - cron: "9 * * * *"
  workflow_dispatch:
concurrency:
  group: angstrom-funnel
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the funnels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}           # news sentiment for new Candidates only
        run: python -u funnel_runner.py
