# One-off diagnostic for a Set's "then … within N closes" (tools/probe_sequence.py). Run by hand.
name: probe-sequence
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r requirements.txt
      - run: python tools/probe_sequence.py
