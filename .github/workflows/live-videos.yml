# Live-site videos: signs in to app.angstromsignals.com as the demo account (DEMO_EMAIL / DEMO_PASSWORD) and records
# every video in video/live_queue.txt with the same voice, captions, opening and closing cards and music as the
# training videos. The demo account is reset to a new account first (video/live_reset.py), so the day-one videos
# build on each other. Results go to the reports branch (live_videos/<date>_<commit>/<name>/) for checking.
# Run by hand from the Actions page, or by pushing the "live-videos" branch.
name: live-videos
on:
  push:
    branches: [live-videos]
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset the demo account first"
        type: boolean
        default: true
      queue:
        description: "Videos to record, space-separated (empty: video/live_queue.txt)"
        type: string
        default: ""
      shots:
        description: "Take website screenshots afterwards"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: live-videos
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
          pip install kokoro-onnx
          # Only what is missing, and nothing recommended: the Ubuntu mirror is sometimes very slow.
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          fc-list | grep -qi "DejaVu Sans" || need="$need fonts-dejavu-core"
          fc-list | grep -qi "Noto Color Emoji" || need="$need fonts-noto-color-emoji"
          if [ -n "$need" ]; then
            sudo apt-get -o Acquire::Retries=3 update -q
            sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends $need
          fi
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      # The voice model (about 340 MB) is kept between runs, so a GitHub download outage does not stop a recording.
      - name: Voice model (cached)
        id: voice
        uses: actions/cache@v4
        with:
          path: out/video/voice_model
          key: kokoro-model-files-v1.0
      - name: Voice model (download when not cached)
        if: steps.voice.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/video/voice_model
          kokoro=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -sSfL --retry 12 --retry-delay 30 --retry-all-errors -o out/video/voice_model/$f $kokoro/$f
          done
      - name: Reset the demo account
        if: github.event_name != 'workflow_dispatch' || inputs.reset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
        run: python video/live_reset.py
      - name: Record
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          QUEUE: ${{ inputs.queue }}
        run: bash video/live_make.sh
      - name: Website screenshots
        if: always() && inputs.shots
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: node video/live_shots.js out/video/shots
      - name: Save to reports branch
        if: always()
        run: |
          dirs=$(ls -d out/video/*/ 2>/dev/null | grep -v voice_model || true)
          [ -n "$dirs" ] && bash .github/scripts/save_to_reports.sh "live_videos/$(date -u +%Y-%m-%d_%H%M)_${GITHUB_SHA::7}" $dirs || echo "nothing to save"
