# The funnel's crypto universe (crypto_universe.py): CoinGecko's top coins that trade on Binance spot, with the
# quality gate. Daily, and by hand. Results go to the reports branch (crypto-universe/latest/) and the job summary.
name: crypto-universe
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "How many of CoinGecko's top coins to check"
        default: "200"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install -q pandas requests
          python crypto_universe.py out --top "${{ github.event.inputs.top || '200' }}" | tee out_summary.txt
          { echo '### Crypto universe'; echo '```'; cat out_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save
        run: bash .github/scripts/save_to_reports.sh crypto-universe/latest out/crypto_universe.json
