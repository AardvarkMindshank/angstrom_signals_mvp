# 🎧 Morning briefings (briefing.py, run_briefings.py): every 15 minutes, make the episodes that are due. A quick
# check first; the voice (Kokoro) and ffmpeg are set up only when at least one briefing is due.
name: Morning briefings
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Make a sample episode from today's readings (saved as a run file, not to any account)"
        type: boolean
        default: false
      voice:
        description: "Voice for the sample (bf_emma, bm_george, af_heart, am_michael)"
        default: bf_emma
concurrency:
  group: briefings
  cancel-in-progress: false
permissions:
  contents: write            # a sample goes to the reports branch
jobs:
  briefings:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Anything due?
        id: check
        run: |
          if [ "${{ inputs.sample }}" = "true" ]; then echo "due=sample" >> "$GITHUB_OUTPUT"; else python run_briefings.py --check; fi
      - name: Voice and ffmpeg
        if: steps.check.outputs.due != '0'
        run: |
          pip install kokoro-onnx
          command -v ffmpeg >/dev/null || { sudo apt-get -o Acquire::Retries=3 update -q && sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends ffmpeg; }
      - name: Voice model (cached)
        if: steps.check.outputs.due != '0'
        uses: actions/cache@v4
        with:
          path: out/video/voice_model
          key: kokoro-model-files-v1.0
      - name: Voice model (download when not cached)
        if: steps.check.outputs.due != '0'
        run: |
          mkdir -p out/video/voice_model
          kokoro=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s out/video/voice_model/$f ] || curl -sSfL --retry 12 --retry-delay 30 --retry-all-errors -o out/video/voice_model/$f $kokoro/$f
          done
      - name: Make the briefings
        if: steps.check.outputs.due != '0' && steps.check.outputs.due != 'sample'
        run: python run_briefings.py
      - name: Make a sample
        if: steps.check.outputs.due == 'sample'
        env:
          VOICE: ${{ inputs.voice }}
        run: mkdir -p out && python run_briefings.py --sample out/briefing_sample.mp3
      - name: Keep the sample
        if: steps.check.outputs.due == 'sample'
        run: bash .github/scripts/save_to_reports.sh "briefing_samples/$(date -u +%Y-%m-%d_%H%M)" out/briefing_sample.mp3 out/briefing_sample.txt
