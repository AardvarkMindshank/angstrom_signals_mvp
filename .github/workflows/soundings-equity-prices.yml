# Equities for Soundings (soundings_equity_prices.py): a fixed random sample of 200 of the S&P 500 members at the
# start of 2016 (later leavers included), daily candles to 29 Oct 2024. Saved on the reports branch:
# data/prices_equity/.
name: soundings-equity-prices
on:
  push:
    branches: [soundings-equity-prices]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
          pip install lxml html5lib
      - name: Fetch
        run: |
          set -o pipefail
          python soundings_equity_prices.py out/prices_equity --sample 200 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save
        run: bash .github/scripts/save_to_reports.sh data out/prices_equity
