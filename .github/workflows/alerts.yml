name: Run Background Alerts

on:
  schedule:
    # Backup only. GitHub often starts this about every 2 hours.
    # Supabase is the clock that starts this workflow every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# One run at a time. A second start waits, and any further start is dropped.
concurrency:
  group: angstrom-alerts
  cancel-in-progress: false

jobs:
  run-alerts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python run_alerts.py
