name: Run Background Alerts

on:
  schedule:
    # Backup only. GitHub often starts this about every 2 hours.
    # Supabase is the clock that starts this workflow every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      refresh_moods:
        description: Rewrite the crypto and stock market sentiment on this run
        required: false
        default: false
        type: boolean

# One run at a time. A second start waits, and any further start is dropped.
concurrency:
  group: angstrom-alerts
  cancel-in-progress: false

jobs:
  run-alerts:
    runs-on: ubuntu-24.04
    # A stuck download must not block every later run.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write          # to start the hourly funnel job (below)
    steps:
      - name: Start the hourly funnel job
        # GitHub's cron schedule for funnel.yml never fires here, but this 5-minute worker runs dependably:
        # a few minutes after each hour it starts funnel.yml, unless one started in the last 40 minutes. The funnel
        # job claims each close once, so an extra start never repeats work. (This worker is itself started every 5
        # minutes from outside GitHub, as workflow_dispatch: GitHub's cron schedules don't fire in this repository.)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(date -u +%M)
          if [ "$m" -ge 8 ] && [ "$m" -le 14 ]; then
            since=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            recent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow funnel.yml -L 5 --json createdAt \
                     -q "[.[] | select(.createdAt > \"$since\")] | length" || echo 1)
            if [ "${recent:-1}" = "0" ]; then gh workflow run funnel.yml -R "$GITHUB_REPOSITORY" --ref main || true; fi
          fi
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          FORCE_MARKET_MOOD: ${{ github.event.inputs.refresh_moods == 'true' && '1' || '' }}
        run: python run_alerts.py
