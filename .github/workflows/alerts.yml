name: Run Background Alerts

on:
  schedule:
    # Backup only. GitHub often starts this about every 2 hours.
    # Supabase is the clock that starts this workflow every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      refresh_moods:
        description: Rewrite the crypto and stock market sentiment on this run
        required: false
        default: false
        type: boolean

# One run at a time. A second start waits, and any further start is dropped.
concurrency:
  group: angstrom-alerts
  cancel-in-progress: false

jobs:
  run-alerts:
    runs-on: ubuntu-24.04
    # A stuck download must not block every later run.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write          # to start the funnel and universe jobs (below)
    steps:
      - name: Start the funnel and universe jobs
        # GitHub's own cron schedules are unreliable here (often hours late), which is why Supabase's clock (pg_cron)
        # starts this worker every 5 minutes (README, HANDOVER). So the worker starts the jobs that need a clock: the funnel job a few
        # minutes after each hour, the crypto universe daily after 01:15 UTC, the equity universe after the New York
        # close on weekdays. Each is started only if it hasn't started recently; the funnel job claims each close
        # once, so an extra start never repeats work.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start_if_quiet() {   # workflow, minutes since its last start
            since=$(date -u -d "$2 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
            recent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" -L 5 --json createdAt \
                     -q "[.[] | select(.createdAt > \"$since\")] | length" || echo 1)
            if [ "${recent:-1}" = "0" ]; then gh workflow run "$1" -R "$GITHUB_REPOSITORY" --ref main || true; fi
          }
          h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M))); d=$(date -u +%u)
          if [ "$m" -ge 8 ] && [ "$m" -le 14 ]; then start_if_quiet funnel.yml 40; fi
          if [ "$h" -eq 1 ] && [ "$m" -ge 15 ]; then start_if_quiet crypto-universe.yml 600; fi
          if [ "$d" -le 5 ] && [ "$h" -eq 22 ] && [ "$m" -ge 40 ]; then start_if_quiet equity-universe.yml 600; fi
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          FORCE_MARKET_MOOD: ${{ github.event.inputs.refresh_moods == 'true' && '1' || '' }}
        run: python run_alerts.py

      - name: Send push notifications
        # 📱 Every new notification goes to its owner's phones and computers (push_notify.py), once.
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python push_notify.py
