name: Website screenshots
# Pictures of public web pages (desktop and phone), saved to the reports branch (site_shots/<time>/) for checking.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Pages (space-separated)"
        default: "https://marketnavi.ai/ https://marketnavi.ai/beta.html"
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Take them
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p out/site_shots
          node -e '
          const { chromium, devices } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const urls = process.env.URLS.split(/\s+/).filter(Boolean);
            for (const [kind, opts] of [["desktop", { viewport: { width: 1440, height: 900 } }], ["phone", devices["iPhone 13"]]]) {
              const c = await b.newContext(opts); const p = await c.newPage();
              for (const [i, u] of urls.entries()) {
                const r = await p.goto(u, { waitUntil: "networkidle", timeout: 60000 }).catch((e) => null);
                console.log(kind, u, r ? r.status() : "failed");
                await p.screenshot({ path: `out/site_shots/${i}_${kind}.png`, fullPage: kind === "desktop" ? false : false });
              }
              await c.close();
            }
            await b.close();
          })();'
      - run: bash .github/scripts/save_to_reports.sh "site_shots/$(date -u +%Y-%m-%d_%H%M)_r${GITHUB_RUN_ID}" out/site_shots
