# Training videos (manual): records the demo page with Playwright, adds an AI voice (Kokoro, offline) and burned-in
# subtitles, and uploads the MP4 as a workflow artifact. Runs when the "video" branch is pushed.
name: video
on:
  push:
    branches: [video]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
          pip install kokoro-onnx
          # Only what is missing, and nothing recommended: the Ubuntu mirror is sometimes very slow.
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          fc-list | grep -qi "DejaVu Sans" || need="$need fonts-dejavu-core"
          if [ -n "$need" ]; then
            sudo apt-get -o Acquire::Retries=3 update -q
            sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends $need
          fi
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
          mkdir -p out/video/voice_model
          kokoro=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL --retry 3 -o out/video/voice_model/kokoro-v1.0.onnx $kokoro/kokoro-v1.0.onnx
          curl -sSfL --retry 3 -o out/video/voice_model/voices-v1.0.bin $kokoro/voices-v1.0.bin
      - name: Voice
        run: python video/narrate.py out/video
      - name: Record
        run: |
          streamlit run video/demo_app.py --server.headless true --server.port 8601 > out/video/streamlit.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8601/_stcore/health && break; sleep 1; done
          node video/record.js http://127.0.0.1:8601/ out/video
      - name: Build
        run: |
          python video/cards.py out/video
          python video/build.py out/video
      - name: Upload to the website
        env:
          HOSTGATOR_FTP_HOST: ${{ secrets.HOSTGATOR_FTP_HOST }}
          HOSTGATOR_FTP_USER: ${{ secrets.HOSTGATOR_FTP_USER }}
          HOSTGATOR_FTP_PASSWORD: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
        run: |
          slug=$(python -c "import json;print(json.load(open('video/script.json'))['slug'])")
          section=$(python -c "import json;print(json.load(open('video/script.json')).get('section','training'))")
          python video/upload.py out/video "$section" "$slug"
          url="https://angstromsignals.com/videos/$section/$slug.mp4"
          code=$(curl -s -o /dev/null -w "%{http_code}" -I "$url" || true)
          echo "Public address: $url (HTTP $code)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to reports branch
        if: always()
        run: bash .github/scripts/save_to_reports.sh "videos/$(date -u +%Y-%m-%d_%H%M)_${GITHUB_SHA::7}" out/video/*.mp4 out/video/*.mp3 out/video/*.srt out/video/*.png out/video/timeline.json out/video/durations.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: video
          path: |
            out/video/*.mp4
            out/video/*.srt
            out/video/*.png
            out/video/*.json
            out/video/streamlit.log
