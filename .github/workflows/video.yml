# Training videos (manual): records the demo page with Playwright, adds an AI voice (Piper, offline) and burned-in
# subtitles, and uploads the MP4 as a workflow artifact. Runs when the "video" branch is pushed.
name: video
on:
  push:
    branches: [video]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
          pip install kokoro-onnx || echo "Kokoro not installed"
          pip install piper-tts==1.3.0 || echo "Piper not installed; espeak-ng will speak"
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu-core
          npm install --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
          mkdir -p out/video/voice_model
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium
          curl -sSfL -o out/video/voice_model/en_US-lessac-medium.onnx $base/en_US-lessac-medium.onnx || true
          curl -sSfL -o out/video/voice_model/en_US-lessac-medium.onnx.json $base/en_US-lessac-medium.onnx.json || true
          kokoro=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL -o out/video/voice_model/kokoro-v1.0.onnx $kokoro/kokoro-v1.0.onnx || true
          curl -sSfL -o out/video/voice_model/voices-v1.0.bin $kokoro/voices-v1.0.bin || true
      - name: Voice
        run: python video/narrate.py out/video
      - name: Record
        run: |
          streamlit run video/demo_app.py --server.headless true --server.port 8601 > out/video/streamlit.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8601/_stcore/health && break; sleep 1; done
          node video/record.js http://127.0.0.1:8601/ out/video
      - name: Build
        run: python video/build.py out/video
      - name: Save to reports branch
        if: always()
        run: bash .github/scripts/save_to_reports.sh "videos/$(date -u +%Y-%m-%d_%H%M)_${GITHUB_SHA::7}" out/video/*.mp4 out/video/*.mp3 out/video/*.srt out/video/*.png out/video/timeline.json out/video/durations.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: video
          path: |
            out/video/*.mp4
            out/video/*.srt
            out/video/*.png
            out/video/*.json
            out/video/streamlit.log
