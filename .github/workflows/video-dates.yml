# Training videos: find past moments (before the hold-out, 30 Oct 2024) when the video Sets give some Yes answers,
# from the saved daily prices. Runs when the "video-dates" branch is pushed; the list goes to the job summary and to
# the reports branch (videos/dates_<commit>.txt).
name: video-dates
on:
  push:
    branches: [video-dates]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
      - name: Saved prices
        run: |
          git fetch -q --depth=1 origin reports
          mkdir -p prices && git archive FETCH_HEAD data/prices | tar -x -C prices
      - name: Search
        run: |
          python video/find_dates.py prices/data/prices pull_v1,pull_v2,w1,w2,w3 2021-01-04 2024-10-28 4 | tee dates.txt
          {
            echo '### Dates with Yes answers (before the hold-out)'
            echo '```'
            grep -E "pull_v1:[2-9]" dates.txt | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save
        if: always()
        run: |
          cp dates.txt "dates_${GITHUB_SHA::7}.txt" || true
          bash .github/scripts/save_to_reports.sh videos "dates_${GITHUB_SHA::7}.txt"
