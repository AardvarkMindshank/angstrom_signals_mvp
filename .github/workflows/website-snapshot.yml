name: Website snapshot
# Copies the live angstromsignals.com pages (HTML and styles) into a downloadable artifact, so edits start from what is live.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          mkdir site && cd site
          for p in index features evidence faq contact beta disclaimer privacy terms investors; do
            curl -sfL "https://angstromsignals.com/$p.html" -o "$p.html" || echo "missing $p"
          done
          curl -sfL https://angstromsignals.com/styles.css -o styles.css
          ls -la
      - name: Save to the website-live branch
        run: |
          cd site
          git init -q -b website-live
          git config user.name "website snapshot" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Live website snapshot"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" website-live
