name: news-trial
on:
  push:
    branches: [news-trial]
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q kokoro-onnx
      - name: Phonemes
        run: python trials/say_ai.py
