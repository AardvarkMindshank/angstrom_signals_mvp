name: Research

# Scoring audit experiments (research.py). Started by hand from the Actions tab.
# Prices are downloaded once and kept on the "reports" branch, so every run reads the same copy.
on:
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: Download prices again (otherwise the saved copy is used)
        required: false
        default: false
        type: boolean
      years:
        description: Years of history to download
        required: false
        default: "10"
      limit:
        description: Assets per class, for a quick check (0 = all)
        required: false
        default: "0"
      mode:
        description: run (experiments), preflight (development-only checks before the hold-out) or holdout (the one real run)
        required: false
        default: run
        type: choice
        options: [run, preflight, holdout]
      confirm:
        description: For holdout only, type exactly  RUN HOLDOUT holdout-spec-v1
        required: false
        default: ""
      spec_hash:
        description: For holdout only, the spec hash recorded in the signed-off spec
        required: false
        default: ""
      recovery_of:
        description: For a hold-out RECOVERY only, the run id of the attempt that did not finish
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    if: inputs.mode == 'run' || inputs.mode == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scipy  # research statistics only; the app does not use it

      - name: Get the saved prices
        id: prices
        env:
          REFRESH: ${{ inputs.refresh_prices }}
        run: |
          if [ "$REFRESH" != "true" ] && git fetch --depth=1 origin reports 2>/dev/null \
             && git checkout FETCH_HEAD -- data/prices 2>/dev/null; then
            mv data/prices prices
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Using the saved prices."
          else
            python research.py cache --out prices --years "${{ inputs.years }}"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save new prices to the reports branch
        if: steps.prices.outputs.fresh == 'true'
        run: |
          mkdir -p staged_data && cp -r prices staged_data/prices
          bash .github/scripts/save_to_reports.sh data staged_data/prices

      - name: Run the experiments
        run: python research.py run --prices prices --out out --limit "${{ inputs.limit }}"

      - name: Show the result on the run page
        if: always()
        run: |
          if [ -f out/primary_dev.md ]; then cat out/primary_dev.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f out/report.md ]; then cat out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save the results to the reports branch
        if: always()
        run: |
          if [ -d out ]; then
            bash .github/scripts/save_to_reports.sh "research/$(date -u +%Y-%m-%d_%H%M)_limit${{ inputs.limit }}_v2" out/report.md out/report.json out/primary_dev.md
          fi

  preflight:
    if: inputs.mode == 'preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"
      - name: Install the locked environment
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
      - name: Get the frozen prices
        run: |
          git fetch --depth=1 origin reports
          git checkout FETCH_HEAD -- data/prices
          mv data/prices prices
          (cd prices && sha256sum *.csv.gz manifest.json) > price_checksums.txt
      - name: Preflight (development data only)
        run: |
          python research.py preflight --prices prices --out out
          python --version > out/environment.txt
          pip freeze >> out/environment.txt
          cp price_checksums.txt out/
          (cd out && sha256sum * > sha256sums.txt)
          cat out/preflight.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save to the reports branch
        if: always()
        run: |
          if [ -d out ]; then
            bash .github/scripts/save_to_reports.sh "research/$(date -u +%Y-%m-%d_%H%M)_preflight" out/*
          fi

  holdout:
    # The one hold-out run (spec section 12). A first run needs the typed confirmation; a recovery after a
    # crashed or stopped attempt needs the recovery confirmation AND the run id of that attempt.
    if: >-
      inputs.mode == 'holdout' &&
      github.ref_type == 'tag' && github.ref_name == 'holdout-spec-v1' &&
      (inputs.confirm == 'RUN HOLDOUT holdout-spec-v1' ||
       (inputs.confirm == 'RECOVER HOLDOUT holdout-spec-v1' && inputs.recovery_of != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: holdout-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"
      - name: Install the locked environment (no data yet)
        run: |
          test -f requirements-research.lock || { echo "requirements-research.lock is missing"; exit 1; }
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
      - name: Data-free guards (tag, typed hash)
        env:
          SPEC_HASH: ${{ inputs.spec_hash }}
        run: python research.py holdout-guard --unlock holdout-spec-v1 --expect-hash "$SPEC_HASH"
      - name: Claim the attempt (durable, atomic; before any price is read)
        id: claim
        env:
          SPEC_HASH: ${{ inputs.spec_hash }}
          RECOVERY_OF: ${{ inputs.recovery_of }}
        run: |
          python .github/scripts/holdout_attempts.py claim --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" --commit "$(git rev-parse HEAD)" \
            --spec-hash "$SPEC_HASH" --recovery-of "$RECOVERY_OF"
          echo "claimed=true" >> "$GITHUB_OUTPUT"
      - name: Get the frozen prices and check them
        run: |
          git fetch --depth=1 origin reports
          git checkout FETCH_HEAD -- data/prices
          mv data/prices prices
          (cd prices && sha256sum -c ../price_checksums.lock)
      - name: The hold-out evaluation
        env:
          SPEC_HASH: ${{ inputs.spec_hash }}
        run: python research.py holdout --prices prices --out out --unlock holdout-spec-v1 --expect-hash "$SPEC_HASH"
      - name: Record the last stage reached, whatever happened
        if: always() && steps.claim.outputs.claimed == 'true'
        run: |
          mkdir -p out && touch out/stage.log
          python .github/scripts/holdout_attempts.py finish --run-id "${{ github.run_id }}" --stage-log out/stage.log
          python .github/scripts/holdout_attempts.py show --out out/attempts.json
      - name: Fingerprint
        if: always() && steps.claim.outputs.claimed == 'true'
        run: |
          git rev-parse HEAD > out/code_commit.txt
          python --version > out/environment.txt && pip freeze >> out/environment.txt
          (cd out && sha256sum * > sha256sums.txt)
          cat out/sha256sums.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/holdout.md ]; then cat out/holdout.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep a copy with the run
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: holdout-attempt-${{ github.run_id }}
          path: out/
          retention-days: 90
      - name: Save to the reports branch
        if: always() && steps.claim.outputs.claimed == 'true'
        run: |
          if [ -f out/holdout.json ] && grep -q outputs_written out/stage.log; then
            bash .github/scripts/save_to_reports.sh "holdout/holdout-spec-v1" out/*
          else
            bash .github/scripts/save_to_reports.sh "holdout/attempts/${{ github.run_id }}" out/*
          fi
