name: eToro probe
# Trade Logbook: test the eToro Read key on the owner's account. Prints only counts and field names (public logs).
on:
  workflow_dispatch:
    inputs:
      min_date:
        description: "Read closed trades from this date (YYYY-MM-DD)"
        default: "2010-01-01"
      page_size:
        description: "Rows per page"
        default: "100"
      mode:
        description: "pages: read every page until an empty one, with request IDs (for eToro support)"
        default: ""
      seal_to:
        description: "export mode only: a public key (base64 PEM). The export is encrypted to it; never stored or shown in plain"
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Read the trade history shape
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          MIN_DATE: ${{ inputs.min_date }}
          MODE: ${{ inputs.mode }}
          PAGE_SIZE: ${{ inputs.page_size }}
          MAX_PAGES: "600"
        run: python .github/scripts/etoro_probe.py
      - name: Seal the export (encrypted to the given public key; the plain file is deleted)
        if: ${{ inputs.mode == 'export' && inputs.seal_to != '' }}
        env:
          SEAL_TO: ${{ inputs.seal_to }}
        run: |
          set -e
          test -f out/export.json
          echo "$SEAL_TO" | base64 -d > pub.pem
          gzip -9 out/export.json
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out/export.json.gz -out sealed.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out key.enc
          shred -u k.bin out/export.json.gz
          ls -la sealed.enc key.enc
          mkdir -p sealed && mv sealed.enc key.enc sealed/
          bash .github/scripts/save_to_reports.sh "probe_sealed/r${GITHUB_RUN_ID}" sealed
