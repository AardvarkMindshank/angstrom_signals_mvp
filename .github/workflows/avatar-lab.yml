# 🎭 Avatar lab (video/avatar_lab.py): presenter test images and clips on fal.ai, from a spec in video/avatar_lab/.
# Private inputs (a photo) come from the reports branch encrypted with the AVATAR_LAB_KEY secret, and when that secret
# is set every output is saved encrypted too; without it, outputs are saved as they are (for invented people only).
name: avatar-lab
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec file in video/avatar_lab/ (e.g. presenters.json)"
        default: presenters.json
      private_inputs:
        description: "Encrypted inputs folder on the reports branch (blank: none)"
        default: ""
      voice:
        description: "Set up the free Kokoro voice (for specs with speak jobs)"
        type: boolean
        default: false
      plain:
        description: "Save the outputs unencrypted (invented characters only: never with private inputs)"
        type: boolean
        default: false
      check:
        description: "Instead of making clips: frame strips of one presenter's library clips (e.g. mate; never cap)"
        default: ""
      unlock:
        description: "Save these private inputs unencrypted: invented guests only, names starting guest_ (e.g. guest_cat_1.png)"
        default: ""
      recover:
        description: "Fetch clips fal already made instead of making new ones: '<start>,<end>' in UTC (blank: make)"
        default: ""
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Clip check (frames)
        if: inputs.check != ''
        env:
          LAB_KEY: ${{ secrets.AVATAR_LAB_KEY }}
          WHO: ${{ inputs.check }}
        run: |
          [ "$WHO" != "cap" ] || { echo "Not the captain's clips"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          git fetch -q origin reports
          mkdir -p lib out/check
          for f in $(git ls-tree --name-only origin/reports avatar_lab/library_captain/); do
            git show "origin/reports:$f" > lib.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -in lib.enc -out lib.tgz -pass env:LAB_KEY
            tar -xzf lib.tgz -C lib --wildcards "avatar_lab/${WHO}_*.mp4" 2>/dev/null || true
            rm -f lib.enc lib.tgz
          done
          for c in lib/avatar_lab/${WHO}_*.mp4; do
            n=$(basename "$c" .mp4)
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$c")
            for i in 1 2 3 4 5; do
              ffmpeg -v error -y -ss "$(python3 -c "print($d*($i-0.5)/5)")" -i "$c" -frames:v 1 -vf scale=-1:300 "f$i.jpg"
            done
            ffmpeg -v error -y -i f1.jpg -i f2.jpg -i f3.jpg -i f4.jpg -i f5.jpg -filter_complex hstack=5 "out/check/$n.jpg"
          done
          ls out/check | wc -l
          rm -rf lib f*.jpg
          bash .github/scripts/save_to_reports.sh "avatar_lab/check_${WHO}" out/check
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Voice (Kokoro)
        if: inputs.voice
        run: |
          pip install kokoro-onnx numpy
          mkdir -p out/video/voice_model
          kokoro=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -sSfL --retry 12 --retry-delay 30 --retry-all-errors -o out/video/voice_model/$f $kokoro/$f
          done
      - name: Private inputs
        if: inputs.private_inputs != ''
        env:
          LAB_KEY: ${{ secrets.AVATAR_LAB_KEY }}
          FOLDER: ${{ inputs.private_inputs }}
        run: |
          [ -n "$LAB_KEY" ] || { echo "AVATAR_LAB_KEY is not set"; exit 1; }
          git fetch -q origin reports
          mkdir -p lab_in
          for f in $(git ls-tree --name-only origin/reports "$FOLDER/"); do
            git show "origin/reports:$f" > enc.bin
            openssl enc -d -aes-256-cbc -pbkdf2 -in enc.bin -out "lab_in/$(basename "${f%.enc}")" -pass env:LAB_KEY
          done
          rm -f enc.bin
      - name: Unlock invented characters
        if: inputs.unlock != ''
        env:
          NAMES: ${{ inputs.unlock }}
        run: |
          # The ship's cat and the holiday guests are original designs, saved encrypted only because the lab saves
          # everything that way by default. Never anything else (the captain stays encrypted).
          mkdir -p out/unlocked
          for n in ${NAMES//,/ }; do
            case "$n" in guest_*) cp "lab_in/$n" out/unlocked/ ;; *) echo "Refused: $n"; exit 1 ;; esac
          done
          bash .github/scripts/save_to_reports.sh "avatar_lab/unlocked" out/unlocked
      - name: ffmpeg (to match recovered clips by their sound)
        if: inputs.recover != '' || inputs.voice
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
      - name: Make
        if: inputs.check == '' && inputs.unlock == ''
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          RECOVER: ${{ inputs.recover }}
        run: |
          git fetch -q origin reports || true     # for jobs that read a plain file from it (reports:...)
          python video/avatar_lab.py "video/avatar_lab/${{ inputs.spec }}" lab_in out/avatar_lab
      - name: Keep (encrypted when the lab key is set)
        if: always() && inputs.check == '' && inputs.unlock == ''
        env:
          LAB_KEY: ${{ secrets.AVATAR_LAB_KEY }}
          PLAIN: ${{ inputs.plain && inputs.private_inputs == '' }}
        run: |
          stamp="$(date -u +%Y-%m-%d_%H%M)_r${GITHUB_RUN_ID}"
          if [ "$PLAIN" = "true" ]; then LAB_KEY=""; fi
          if [ -n "$LAB_KEY" ]; then
            mkdir -p out/avatar_lab_enc
            tar -C out -czf lab.tgz avatar_lab
            openssl enc -aes-256-cbc -pbkdf2 -salt -in lab.tgz -out out/avatar_lab_enc/lab.tgz.enc -pass env:LAB_KEY
            # GitHub refuses files over 100 MB: big batches are kept in 90 MB parts (join them with cat to decrypt).
            if [ "$(stat -c %s out/avatar_lab_enc/lab.tgz.enc)" -gt 94371840 ]; then
              split -b 90m -d out/avatar_lab_enc/lab.tgz.enc out/avatar_lab_enc/lab.tgz.enc.part-
              rm out/avatar_lab_enc/lab.tgz.enc
            fi
            bash .github/scripts/save_to_reports.sh "avatar_lab/$stamp" out/avatar_lab_enc
          else
            bash .github/scripts/save_to_reports.sh "avatar_lab/$stamp" out/avatar_lab
          fi
          rm -rf lab_in
