# 🎭 Avatar lab (video/avatar_lab.py): presenter test images and clips on fal.ai, from a spec in video/avatar_lab/.
# Private inputs (a photo) come from the reports branch encrypted with the AVATAR_LAB_KEY secret, and when that secret
# is set every output is saved encrypted too; without it, outputs are saved as they are (for invented people only).
name: avatar-lab
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec file in video/avatar_lab/ (e.g. presenters.json)"
        default: presenters.json
      private_inputs:
        description: "Encrypted inputs folder on the reports branch (blank: none)"
        default: ""
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Private inputs
        if: inputs.private_inputs != ''
        env:
          LAB_KEY: ${{ secrets.AVATAR_LAB_KEY }}
          FOLDER: ${{ inputs.private_inputs }}
        run: |
          [ -n "$LAB_KEY" ] || { echo "AVATAR_LAB_KEY is not set"; exit 1; }
          git fetch -q origin reports
          mkdir -p lab_in
          for f in $(git ls-tree --name-only origin/reports "$FOLDER/"); do
            git show "origin/reports:$f" > enc.bin
            openssl enc -d -aes-256-cbc -pbkdf2 -in enc.bin -out "lab_in/$(basename "${f%.enc}")" -pass env:LAB_KEY
          done
          rm -f enc.bin
      - name: Make
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python video/avatar_lab.py "video/avatar_lab/${{ inputs.spec }}" lab_in out/avatar_lab
      - name: Keep (encrypted when the lab key is set)
        if: always()
        env:
          LAB_KEY: ${{ secrets.AVATAR_LAB_KEY }}
        run: |
          stamp="$(date -u +%Y-%m-%d_%H%M)"
          if [ -n "$LAB_KEY" ]; then
            mkdir -p out/avatar_lab_enc
            tar -C out -czf lab.tgz avatar_lab
            openssl enc -aes-256-cbc -pbkdf2 -salt -in lab.tgz -out out/avatar_lab_enc/lab.tgz.enc -pass env:LAB_KEY
            bash .github/scripts/save_to_reports.sh "avatar_lab/$stamp" out/avatar_lab_enc
          else
            bash .github/scripts/save_to_reports.sh "avatar_lab/$stamp" out/avatar_lab
          fi
          rm -rf lab_in
