# 🎬 The daily forecast video (daily_video.py): about 90 seconds, 16:9 and 9:16, from the Morning forecast's facts,
# with the crew's clip library (encrypted on the reports branch) and the weather music. Started each day by alerts.yml
# once the Asia & Europe Morning forecast is made, and published to the app (briefings bucket, video/). Run by hand
# without "publish" for a test: then the result is saved encrypted (AVATAR_LAB_KEY) on the reports branch instead.
name: daily-video
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "east (after the US close) or west"
        default: east
      presenter:
        description: "Who presents (blank: the daily draw): cap, mate, nav, deck, cat, cook, admiral or rat"
        default: ""
      plain:
        description: "A test with a named presenter other than the captain: save it unencrypted (for review)"
        type: boolean
        default: false
      publish:
        description: "Publish to the app (the daily run does)"
        type: boolean
        default: false
      publish_test:
        description: "Instead of making one: publish a reviewed plain test as it is (its folder on the reports branch, e.g. daily_video/test_deck_2026-11-24_1238/daily_video_plain)"
        default: ""
      audit:
        description: "Instead of a video: list every presenter clip's length and where its voice ends (names and seconds only)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-video
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LAB_KEY: ${{ secrets.AVATAR_LAB_KEY }}
      # The same data keys as the app's background job, so the sentiment refresh before the video scores every reading
      # (24 Nov 2026: without them it scored only the readings it could fetch).
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        timeout-minutes: 25
        run: |
          # A stuck Ubuntu mirror once held this step for 25 minutes: give up on a silent mirror after 30 s and retry
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99timeouts > /dev/null
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install kokoro-onnx
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          fc-list | grep -qi "Inter" || need="$need fonts-inter"
          fc-list | grep -qi "Noto Color Emoji" || need="$need fonts-noto-color-emoji"
          if [ -n "$need" ]; then
            sudo apt-get -o Acquire::Retries=3 update -q
            sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends $need
          fi
          npm install --no-save --silent playwright@1.63.0
          # The browser download has hung for 25 minutes twice (24 Nov 2026): give each try 4 minutes, up to 3 tries.
          # The runner already has Google Chrome and its libraries; the renderer falls back to it when this download fails.
          timeout 180 npx playwright install chromium > /dev/null || echo "Playwright's browser didn't download; using the runner's Chrome."
      - name: Voice model (cached)
        id: voice
        uses: actions/cache@v4
        with:
          path: out/video/voice_model
          key: kokoro-model-files-v1.0
      - name: Voice model (download when not cached)
        if: steps.voice.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/video/voice_model
          kokoro=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -sSfL --retry 12 --retry-delay 30 --retry-all-errors -o out/video/voice_model/$f $kokoro/$f
          done
      - name: Captain clips and music
        run: |
          [ -n "$LAB_KEY" ] || { echo "AVATAR_LAB_KEY is not set"; exit 1; }
          git fetch -q origin reports
          mkdir -p lib
          # Every clip pack in the library (the first set, then additions such as the story and weekend lines).
          for f in $(git ls-tree --name-only origin/reports avatar_lab/library_captain/); do
            git show "origin/reports:$f" > lib.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -in lib.enc -out lib.tgz -pass env:LAB_KEY
            tar -xzf lib.tgz -C lib && rm -f lib.enc lib.tgz
          done
          # Packs of invented characters only (the bloopers), kept unencrypted.
          for f in $(git ls-tree --name-only origin/reports avatar_lab/library_plain/); do
            git show "origin/reports:$f" > lib.tgz && tar -xzf lib.tgz -C lib && rm -f lib.tgz
          done
          mkdir -p music
          for f in 1-Sunshine 2-Springtime 3-Cloudy 4-Rainy 5-Stormy; do
            git show "origin/reports:drive/1EKuY0a0mL0hsCwO98ok-K0t_Yh-L_hsm/drive/$f.mp3" > "music/$f.mp3"
          done
      - name: Publish a reviewed test
        if: inputs.publish_test != ''
        id: pubtest
        env:
          FROM: ${{ inputs.publish_test }}
        run: |
          case "$FROM" in daily_video/test_*/daily_video_plain) ;; *) echo "Not a plain test folder"; exit 1 ;; esac
          mkdir -p reviewed
          for f in $(git ls-tree --name-only origin/reports "$FROM/"); do git show "origin/reports:$f" > "reviewed/$(basename "$f")"; done
          python daily_video.py --publish-from reviewed
      - name: Clip audit
        if: inputs.audit
        run: python video/clip_audit.py lib/avatar_lab
      - name: Tide up to the latest close (so the screens and the script agree with the Tides panel)
        if: ${{ !inputs.audit && inputs.publish_test == '' }}
        run: python daily_video.py --tide-only || echo "Tides refresh skipped."
      - name: App screens (fresh from the live app; a stored copy for any that fail)
        if: ${{ !inputs.audit && inputs.publish_test == '' }}
        timeout-minutes: 9
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          git fetch -q origin reports || true
          for f in $(git ls-tree --name-only origin/reports daily_video/screens/ 2>/dev/null); do
            git show "origin/reports:$f" > "video/daily/screens/$(basename "$f")"
          done
          NODE_PATH="$PWD/node_modules" timeout 420 node video/daily_screens.js video/daily/screens || echo "App screens: capture stopped; stored copies kept."
          bash .github/scripts/save_to_reports.sh daily_video/screens video/daily/screens/*.jpg || true
      - name: Make the video
        if: ${{ !inputs.audit && inputs.publish_test == '' }}
        id: make
        run: NODE_PATH="$PWD/node_modules" python daily_video.py --library lib/avatar_lab --music music --out out/daily_video --edition "${{ inputs.edition }}" --presenter "${{ inputs.presenter }}" ${{ inputs.publish && '--publish' || '' }}
      # The social channels are posted at 08:00 Bangkok by the 5-minute worker (alerts.yml → social-post.yml).
      - name: Keep (encrypted)
        if: always() && !inputs.publish
        run: |
          rm -rf lib
          [ -d out/daily_video ] || exit 0
          mkdir -p out/daily_video_enc
          tar -C out/daily_video -czf dv.tgz --exclude=work .
          if [ "${{ inputs.plain }}" = "true" ] && [ -n "${{ inputs.presenter }}" ] && [ "${{ inputs.presenter }}" != "cap" ] \
             && ! grep -q '"guest"' out/daily_video/script.json; then
            mkdir -p out/daily_video_plain && cp out/daily_video/*.mp4 out/daily_video/script.json out/daily_video_plain/
            bash .github/scripts/save_to_reports.sh "daily_video/test_${{ inputs.presenter }}_$(date -u +%Y-%m-%d_%H%M)" out/daily_video_plain
            exit 0
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -in dv.tgz -out out/daily_video_enc/video.tgz.enc -pass env:LAB_KEY
          bash .github/scripts/save_to_reports.sh "daily_video/$(date -u +%Y-%m-%d_%H%M)" out/daily_video_enc
