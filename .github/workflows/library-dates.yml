# Provided library: run every provided Set at past moments before the hold-out (30 Oct 2024) on the saved daily
# prices. Runs when the "library-dates" branch is pushed; the summary goes to the job summary and to the reports
# branch (library/dates_<commit>.txt).
name: library-dates
on:
  push:
    branches: [library-dates]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-research.lock
      - name: Saved prices
        run: |
          git fetch -q --depth=1 origin reports
          mkdir -p prices && git archive FETCH_HEAD data/prices | tar -x -C prices
      - name: Run the library at past moments
        run: |
          python video/library_dates.py prices/data/prices 2021-06-01 2024-10-28 14 | tee dates.txt
          { echo '### Provided library at past moments (before the hold-out)'; echo '```'; sed -n '/## Summary/,$p' dates.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save
        if: always()
        run: |
          cp dates.txt "dates_${GITHUB_SHA::7}.txt" || true
          bash .github/scripts/save_to_reports.sh library "dates_${GITHUB_SHA::7}.txt"
