<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MarketNavi</title>
<link rel="icon" href="/favicon.png">
<!-- saved to a phone's home screen: its own icon and name, opening on the new app -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MarketNavi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<script>/* one address for the app: www.marketnavi.ai keeps its own sign-in, so send it to marketnavi.ai */
if (location.hostname.indexOf("www.") === 0) location.replace(location.href.replace("//www.", "//"));</script>
<script>/* the remembered day or night, before the app loads (src/lib/theme.js) */
try { var m = localStorage.getItem("mn_ui_mode") || "auto"; var n = m === "night" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.style.background = n ? "#0d1015" : "#ffffff"; } catch (e) {}</script>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
