<!doctype html>
<html><head><meta charset="utf-8">
<!-- 🎬 The daily forecast video's graphics (daily_video.py): setup(spec) once, then render(t) for any moment, so
     every frame is exact. The captain clips are laid over the framed box afterwards by ffmpeg. -->
<style>
  :root { --teal:#2dd4bf; --amber:#f5a524; --up:#34d399; --down:#f87171; --ink:#f8fafc; --soft:#a5b4cc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { overflow:hidden; background:#04102a; font-family:"Inter Display","Inter",sans-serif; color:var(--ink); }
  #stage { position:absolute; left:0; top:0; overflow:hidden; }
  #screens { position:absolute; inset:0; overflow:hidden; perspective:1800px; }
  #screens img { position:absolute; left:50%; top:50%; border-radius:26px; will-change:transform,opacity;
                 box-shadow:0 40px 120px rgba(0,0,0,.6); filter:saturate(.8) blur(1.5px); }
  #bg { position:absolute; inset:-200px; }
  #grid { position:absolute; inset:0; opacity:.08; background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
          linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px); background-size:80px 80px; }
  svg#waves { position:absolute; left:0; bottom:0; width:100%; height:380px; }
  .seg { position:absolute; inset:0; will-change:transform,opacity; }
  .it { will-change:transform,opacity; }
  #top { position:absolute; left:56px; top:40px; display:flex; gap:14px; align-items:center; font-weight:700; font-size:26px; color:#dbe4f3; }
  #top .pill { padding:8px 18px; border-radius:999px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.2); }
  #foot { position:absolute; right:40px; bottom:24px; font-size:20px; color:rgba(255,255,255,.55); }
  .frame { position:absolute; border-radius:38px; box-shadow:0 0 0 3px rgba(45,212,191,.55), 0 30px 80px rgba(0,0,0,.55), 0 0 60px rgba(45,212,191,.25); background:#0b1f45; }
  .cap { position:absolute; display:flex; flex-direction:column; justify-content:center; }
  .kicker { font-weight:900; text-transform:uppercase; letter-spacing:-2px; line-height:.95;
            background:linear-gradient(90deg,#fff 0%,#c7f9f1 55%,#2dd4bf 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-weight:500; color:#dbe4f3; line-height:1.25; }
  .card { background:rgba(8,20,48,.78); border:1px solid rgba(255,255,255,.16); border-radius:28px; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .tile { padding:26px 30px; }
  .tile .n { font-size:26px; color:var(--soft); font-weight:600; }
  .tile .v { font-size:48px; font-weight:800; margin-top:6px; }
  .chg { font-weight:800; }
  .chg.up { color:var(--up); } .chg.down { color:var(--down); }
  .row { display:flex; align-items:center; gap:24px; padding:18px 28px; }
  .row .name { font-weight:700; font-size:34px; width:220px; }
  .row .price { font-size:32px; color:#e2e8f0; width:240px; text-align:right; }
  .row .chg { font-size:32px; width:150px; text-align:right; }
  .grid { display:grid; gap:24px; }
</style></head>
<body><div id="stage"><div id="bg"></div><div id="grid"></div>
<svg id="waves" viewBox="0 0 1920 380" preserveAspectRatio="none">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#0b2d72" stop-opacity="0"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity=".38"/><stop offset="1" stop-color="#0b2d72" stop-opacity="0"/></linearGradient>
  </defs>
  <path id="p2" fill="url(#w2)"/><path id="p1" fill="url(#w1)"/>
</svg>
<div id="screens"></div>
<div id="segs"></div>
<div id="top"><span class="pill" id="topdate"></span><span id="topw"></span></div>
<div id="foot">Readings describe markets. Not financial advice.</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const outC = (x) => 1 - Math.pow(1 - x, 3);
const inC = (x) => x * x * x;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let S = null, W = 1920, H = 1080, P = false;     // spec, size, portrait?

const MOODS = { sunny: ["#0b3a7a", "#1d6fb8", "rgba(250,204,21,.25)"], fair: ["#0a2a63", "#155e9f", "rgba(45,212,191,.22)"],
  changeable: ["#08214f", "#0f3f80", "rgba(148,163,184,.22)"], rough: ["#061a40", "#0b2d5c", "rgba(100,116,139,.25)"],
  stormy: ["#040d24", "#0a1c3d", "rgba(239,68,68,.18)"] };

function pct(v, d = 1) { return v == null ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d) + "%"; }
// Green for good news, red for bad: for a metric where up is bad (the fear index), a rise is red.
function cls(v, inverse) { return v == null ? "" : (v >= 0) !== !!inverse ? "up" : "down"; }
function money(v) {
  if (v == null) return "";
  if (v >= 1000) return "$" + Math.round(v).toLocaleString("en-US");
  if (v >= 1) return "$" + v.toFixed(2);
  return "$" + v.toFixed(4);
}
function spark(vals, w, h, colour) {
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - (v - lo) / span * h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${colour}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
let GID = 0;
// The news mood as the app shows it (feedback 23 Nov 2026): -100..+100, 0 = mixed, with the app's words.
function gauge(mood, size) {
  const gid = "g" + (++GID);
  if (!mood || mood.value == null) return "";
  const v = mood.value;
  const a = Math.PI * (1 - clamp((v + 100) / 200)), r = size * 0.42, cx = size / 2, cy = size * 0.55;
  const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  const w = String(mood.words || ""), word = w.charAt(0).toUpperCase() + w.slice(1);
  const shown = (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
  return `<svg width="${size}" height="${size * 0.72}" viewBox="0 0 ${size} ${size * 0.72}">
    <defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="#f87171"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
    <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="url(#${gid})" stroke-width="${size * 0.07}" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="${size * 0.025}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${size * 0.035}" fill="#fff"/>
    <text x="${cx}" y="${cy + size * 0.13}" text-anchor="middle" font-size="${size * (word.length > 10 ? 0.085 : 0.1)}" font-weight="800" fill="#fff">${shown} · ${esc(word)}</text></svg>`;
}

// ---- each segment's content (absolute positions differ by shape)
function capCaption(seg) {
  const d = S.data;
  const tideWord = d.tide.state === "out" ? "Tide going out" : d.tide.state === "in" ? "Tide coming in" : "Tide turning";
  const titles = { welcome: [d.weekend ? "Weekend<br>forecast" : "Morning<br>forecast", d.date], weather: [esc(d.weather_word), `${tideWord} · Sea ${esc(d.tide.sea)}`],
    sign_story: ["The story<br>of the day", esc(d.story?.title || "")],
    sign_tides: ["The tide &amp;<br>currents", "The big picture"], sign_equities: ["Equity<br>markets", "S&amp;P 500 · Nasdaq"],
    sign_crypto: ["The crypto<br>seas", "Bitcoin and the top coins"], sign_horizon: ["On the<br>horizon", "What's coming up"],
    signoff: ["Fair winds", "and following seas"], tag: ["Shh…", "Don't tell the cat"] };
  const [k, s] = titles[seg.kind] || ["", ""];
  const icon = seg.kind === "weather" ? `<div class="it" style="font-size:${P ? 120 : 130}px;line-height:1.1">${d.weather_icon}</div>` : "";
  return icon + `<div class="it kicker" style="font-size:${P ? 112 : 120}px">${k}</div><div class="it sub" style="font-size:${P ? 54 : 46}px;margin-top:22px">${s}</div>`;
}

// Sizes: z(wide, tall). The tall (phone) layout stacks everything full width with big type (feedback 20 Nov 2026):
// nothing under about 40px on a 1080-wide frame.
const z = (land, port) => (P ? port : land);
// A change and the period it covers, each coloured by its own sign (feedback 23 Nov 2026).
function per(v, label, size, inverse) {
  return `<span class="chg ${cls(v, inverse)}" style="font-size:${size}px">${pct(v)}</span><span style="font-size:${Math.round(size * 0.62)}px;color:var(--soft);font-weight:600;margin-left:8px">${label}</span>`;
}
function chgText(c) { return c.pts ? (c.change >= 0 ? "+" : "−") + Math.abs(c.change ?? 0).toFixed(1) + " pts" : pct(c.change); }
function val(c) { return (c.dollars ? "$" : "") + num(c.value); }
function num(v) { return v == null ? "" : v >= 100 ? Math.round(v).toLocaleString("en-US") : v.toFixed(2); }

function narrContent(seg) {
  const d = S.data;
  if (seg.kind === "intro") {
    return `<div style="text-align:center"><img class="it zoom" src="${d.brand.logo}" style="height:${z(700, 820)}px;max-width:100%;object-fit:contain"></div>`;
  }
  const up = (v) => ((v ?? 0) >= 0 ? "#34d399" : "#f87171");
  if (seg.kind === "date") {
    return `<div class="it" style="font-size:${z(120, 150)}px">${d.weather_icon}</div>
      <div class="it kicker" style="font-size:${z(104, 112)}px;margin-top:10px">${esc(d.date)}</div>
      <div class="it sub" style="font-size:${z(58, 70)}px;margin-top:34px;font-weight:700;color:#fff">${esc(d.headline)}</div>`;
  }
  if (seg.kind === "story") {
    const a = d.story?.asset;
    let card = "";
    if (a && a.spark && a.spark.length > 1) {
      card = `<div class="it card" style="padding:${z("30px 40px", "36px 40px")};margin-top:34px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px">
          <div><div style="font-size:${z(48, 60)}px;font-weight:800">${esc(a.name)}</div>
          ${a.price ? `<div style="font-size:${z(40, 48)}px;color:#e2e8f0">${money(a.price)}</div>` : ""}</div>
          <div style="text-align:right;line-height:1.15"><div>${per(a.change_1d, a.day_label || "1 day", z(64, 80))}</div>
          <div style="margin-top:6px">${per(a.change_7d, "1 week", z(40, 50))}</div></div></div>
        <div style="margin-top:20px">${spark(a.spark, z(1500, 900), z(280, 400), up(a.change_7d))}</div>
        <div style="font-size:${z(26, 34)}px;color:var(--soft);margin-top:6px">Last 7 days</div></div>`;
    } else if (a) {
      card = `<div class="it card" style="padding:40px;margin-top:34px;text-align:center">
        <div style="font-size:${z(52, 64)}px;font-weight:800">${esc(a.name)}</div>
        <div style="font-size:${z(110, 140)}px;font-weight:900;margin-top:10px">${val(a)}</div>
        <div class="chg ${cls(a.change_7d, a.inverse)}" style="font-size:${z(52, 64)}px">${chgText({ change: a.change_7d, pts: a.pts })} <span style="color:var(--soft);font-weight:600">· 1 week</span></div></div>`;
    }
    return `<div class="it" style="font-size:${z(40, 50)}px;color:var(--amber);font-weight:800;letter-spacing:2px">⭐ THE STORY OF THE DAY</div>
      <div class="it kicker" style="font-size:${z(96, 104)}px;margin-top:14px">${esc(d.story?.title || "")}</div>${card}`;
  }
  if (seg.kind === "tides") {
    const arrow = d.tide.state === "out" ? "↘" : d.tide.state === "in" ? "↗" : "↔";
    const word = d.tide.state === "out" ? "Going out" : d.tide.state === "in" ? "Coming in" : "Turning";
    const head = `<div class="it card" style="padding:${z("34px 40px", "40px 44px")};display:flex;align-items:center;gap:34px">
        <div style="font-size:${z(120, 150)}px;line-height:1;color:${d.tide.state === "out" ? "var(--down)" : "var(--up)"}">${arrow}</div>
        <div><div class="kicker" style="font-size:${z(78, 92)}px">Tide ${word}</div>
        <div class="sub" style="font-size:${z(36, 46)}px;margin-top:12px">${d.tide.days ? `For ${d.tide.days} trading days · ` : ""}Sea ${esc(d.tide.sea)}</div></div></div>`;
    if (P) {
      const rows = d.currents.map((c) => `<div class="it card" style="padding:28px 40px;display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:48px;font-weight:700;color:#dbe4f3">${esc(c.name)}</div>
          <div style="text-align:right"><div style="font-size:72px;font-weight:800;line-height:1">${val(c)}</div>
          <div class="chg ${cls(c.change, c.inverse)}" style="font-size:44px;margin-top:6px">${chgText(c)} <span style="color:var(--soft);font-weight:600">· 1 week</span></div></div></div>`).join("");
      return head + `<div class="grid" style="margin-top:34px;gap:22px">${rows}</div>`;
    }
    const tiles = d.currents.map((c) => `<div class="it card tile"><div class="n" style="font-size:30px">${esc(c.name)}</div>
      <div class="v" style="font-size:56px">${val(c)}</div>
      <div class="chg ${cls(c.change, c.inverse)}" style="font-size:34px;margin-top:4px">${chgText(c)} <span style="color:var(--soft);font-weight:600">· 1 week</span></div></div>`).join("");
    return head + `<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:28px">${tiles}</div>`;
  }
  if (seg.kind === "equities") {
    const tiles = d.stocks.map((s) => `<div class="it card tile" style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:${z("26px 30px", "32px 40px")}">
      <div><div style="font-size:${z(38, 54)}px;font-weight:800">${esc(s.name)}</div>
      <div style="margin-top:6px;line-height:1.05">${per(s.change_1d, s.day_label || "1 day", z(60, 84))}</div>
      <div style="margin-top:8px">${per(s.change_7d, "1 week", z(38, 48))}</div></div>
      <div style="text-align:center">${spark(s.spark, z(420, 380), z(150, 190), up(s.change_7d))}
      <div style="font-size:${z(24, 32)}px;color:var(--soft)">Last 7 days</div></div></div>`).join("");
    return `<div style="display:flex;flex-direction:${z("row", "column")};gap:${z(30, 34)}px;align-items:${z("center", "stretch")}">
      <div class="it card" style="padding:${z("26px 34px", "30px 34px 20px")};text-align:center"><div style="font-size:${z(34, 46)}px;color:var(--soft);font-weight:700">Stock-market news mood</div>${gauge(d.stock_mood, z(460, 760))}</div>
      <div class="grid" style="flex:1;gap:${z(24, 30)}px">${tiles}</div></div>`;
  }
  if (seg.kind === "crypto") {
    const rows = d.coins.map((c) => P
      ? `<div class="it card" style="display:flex;align-items:center;gap:22px;padding:20px 34px">
          <div style="flex:1"><div style="font-size:50px;font-weight:800;line-height:1.1">${esc(c.name)}</div>
          <div style="font-size:40px;color:#e2e8f0;margin-top:2px">${money(c.price)}</div></div>
          <div style="text-align:right;line-height:1.2"><div>${per(c.change_1d, "24h", 44)}</div><div>${per(c.change_7d, "1 week", 44)}</div></div>
          ${spark(c.spark, 190, 80, up(c.change_7d))}</div>`
      : `<div class="it card row"><div class="name" style="font-size:38px;width:190px">${esc(c.name)}</div>
          <div class="price" style="font-size:36px;width:200px;text-align:left">${money(c.price)}</div>
          <div class="chg ${cls(c.change_1d)}" style="font-size:36px;width:140px">${pct(c.change_1d)}</div>
          <div class="chg ${cls(c.change_7d)}" style="font-size:36px;width:140px">${pct(c.change_7d)}</div>
          ${spark(c.spark, 320, 60, up(c.change_7d))}</div>`).join("");
    // Column titles (wide layout), so each figure says which period it covers.
    const head = P ? "" : `<div class="it row" style="padding:0 28px;font-size:26px;color:var(--soft);font-weight:700">
          <div style="width:190px"></div><div style="width:200px">Price</div><div style="width:140px;text-align:right">24h</div>
          <div style="width:140px;text-align:right">1 week</div><div style="width:320px;text-align:center">Last 7 days</div></div>`;
    return `<div style="display:flex;flex-direction:${z("row", "column")};gap:${z(30, 28)}px;align-items:${z("center", "stretch")}">
      <div class="it card" style="padding:${z("26px 34px", "26px 34px 14px")};text-align:center"><div style="font-size:${z(34, 46)}px;color:var(--soft);font-weight:700">Crypto news mood</div>${gauge(d.crypto_mood, z(440, 640))}</div>
      <div class="grid" style="gap:${z(14, 18)}px;flex:1">${head}${rows}</div></div>`;
  }
  if (seg.kind === "horizon") {
    const cards = (d.events.length ? d.events : [{ what: "A quiet week", when: "", why: "No big scheduled releases." }]).map((e) =>
      `<div class="it card" style="padding:${z("30px 36px", "40px 44px")}"><div style="font-size:${z(36, 46)}px;color:var(--amber);font-weight:800">📅 ${esc(e.when)}${e.when ? " UTC" : ""}</div>
       <div style="font-size:${z(60, 84)}px;font-weight:800;margin-top:12px;line-height:1.05">${esc(e.what)}</div>
       <div class="sub" style="font-size:${z(36, 46)}px;margin-top:16px">${esc(e.why || "")}</div></div>`).join("");
    return `<div class="it kicker" style="font-size:${z(96, 120)}px;margin-bottom:36px">On the horizon</div><div class="grid" style="gap:28px">${cards}</div>`;
  }
  if (seg.kind === "close") {
    if (d.brand.show && d.brand.logo) {
      return `<div style="text-align:center"><img class="it zoom" src="${d.brand.logo}" style="height:${z(500, 640)}px;max-width:100%;object-fit:contain">
        <div class="it sub" style="font-size:${z(44, 56)}px;margin-top:${z(30, 50)}px;color:#fff;font-weight:700">Your ${d.weekend ? "weekend" : "daily"} market briefing · ${esc(d.date)}</div>
        <div class="it sub" style="font-size:${z(30, 40)}px;margin-top:${z(26, 40)}px;color:#cbd5e1">${esc(d.brand.domain)} · © ${d.brand.year} ${esc(d.brand.company)}<br>Readings describe markets. Not financial advice.</div></div>`;
    }
    return `<div style="text-align:center"><div class="it" style="font-size:${z(110, 150)}px">⚓</div>
      <div class="it kicker" style="font-size:${z(96, 116)}px;margin-top:16px">Your daily<br>market briefing</div>
      <div class="it sub" style="font-size:${z(48, 60)}px;margin-top:26px">${esc(d.date)}</div>
      <div class="it sub" style="font-size:${z(32, 42)}px;margin-top:50px;color:#cbd5e1">Readings describe markets.<br>Not financial advice.</div></div>`;
  }
  return "";
}

// 🖥️ The matching app screen behind each section: dim, angled and drifting slowly (fixed pictures from the app).
const SCREEN_OF = { welcome: "snapshot", date: "snapshot", weather: "tides", sign_story: "chart", story: "chart",
  sign_tides: "tides", tides: "tides", sign_equities: "table", equities: "table", sign_crypto: "chart", crypto: "chart",
  sign_horizon: "tides", horizon: "tides", signoff: "funnel", tag: "funnel" };          // no app screen behind the closing logo card
const SCREEN_DIM = 0.13;
let SPANS = [];
function buildScreens(segments) {
  SPANS = [];
  for (const seg of segments) {
    const key = SCREEN_OF[seg.kind];
    const last = SPANS[SPANS.length - 1];
    if (last && last.key === key) last.end = seg.end; else SPANS.push({ key, start: seg.start, end: seg.end });
  }
  SPANS.forEach((sp, i) => {
    const img = document.createElement("img");
    img.src = "screens/" + sp.key + ".jpg";
    img.style.width = (P ? 1500 : 2100) + "px";
    sp.el = img; sp.dir = i % 2 ? -1 : 1;
    $("screens").appendChild(img);
  });
}
function renderScreens(t) {
  for (const sp of SPANS) {
    const fin = clamp((t - sp.start + 0.5) / 0.9), fout = clamp((sp.end + 0.5 - t) / 0.9);
    const o = SCREEN_DIM * Math.min(fin, fout);
    sp.el.style.opacity = String(o);
    if (o <= 0) { sp.el.style.display = "none"; continue; }
    sp.el.style.display = "block";
    const k = clamp((t - sp.start) / Math.max(sp.end - sp.start, 1));
    const dx = sp.dir * (-80 + 160 * k), dy = -20 + 40 * k;
    sp.el.style.transform = `translate(-50%,-50%) translate(${dx}px,${dy}px) rotateY(${sp.dir * -16}deg) rotateX(9deg) rotateZ(${sp.dir * -4}deg) scale(${1.05 + 0.06 * k})`;
  }
}

window.setup = function (spec) {
  S = spec; P = spec.layout === "port";
  [W, H] = P ? [1080, 1920] : [1920, 1080];
  document.body.style.width = W + "px"; document.body.style.height = H + "px";
  const st = $("stage"); st.style.width = W + "px"; st.style.height = H + "px";
  const m = MOODS[spec.data.weather] || MOODS.changeable;
  $("bg").style.background = `radial-gradient(1100px 800px at 30% 15%, ${m[2]}, transparent 60%), radial-gradient(1000px 900px at 85% 90%, rgba(37,99,235,.3), transparent 60%), linear-gradient(160deg, ${m[0]} 0%, ${m[1]} 100%)`;
  $("topdate").textContent = spec.data.date;
  if (P) { $("top").style.fontSize = "36px"; $("top").style.left = "44px"; $("foot").style.fontSize = "30px"; $("foot").style.right = "44px"; $("foot").style.bottom = "34px"; }
  else { $("foot").style.fontSize = "24px"; }
  $("topw").textContent = spec.data.weather_icon + " " + spec.data.weather_word;
  const [bx, by, bw, bh] = spec.box;
  const holder = $("segs");
  for (const seg of spec.segments) {
    const el = document.createElement("div");
    el.className = "seg"; el.dataset.kind = seg.kind;
    if (seg.who === "cap") {
      const cap = P ? `left:90px;right:90px;top:${by + bh + 120}px;height:${H - by - bh - 220}px;text-align:center;align-items:center`
                    : `left:${bx + bw + 110}px;right:90px;top:${by}px;height:${bh}px`;
      const who = seg.title || spec.data.presenter?.title || "";
      const badge = who ? `<div class="it" style="position:absolute;left:${bx}px;width:${bw}px;top:${by + bh + 18}px;text-align:center;z-index:2">
          <span style="display:inline-block;padding:${P ? "12px 30px" : "10px 26px"};border-radius:999px;background:rgba(245,165,36,.92);color:#1a1205;font-weight:800;font-size:${P ? 40 : 32}px">⚓ ${esc(who)}</span></div>` : "";
      el.innerHTML = `<div class="frame it" style="left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px"></div>${badge}<div class="cap" style="${cap}">${capCaption(seg)}</div>`;
    } else {
      const box = P ? "left:70px;right:70px;top:190px;bottom:170px" : "left:110px;right:110px;top:150px;bottom:120px";
      el.innerHTML = `<div style="position:absolute;${box};display:flex;flex-direction:column;justify-content:center">${narrContent(seg)}</div>`;
    }
    seg.el = el; seg.items = Array.from(el.querySelectorAll(".it"));
    holder.appendChild(el);
  }
  buildScreens(spec.segments);
  window.render(0);
};

function wave(id, t, amp, len, speed, base, phase) {
  let d = `M0 380 L0 ${base}`;
  for (let x = 0; x <= 1920; x += 24) {
    const y = base + amp * Math.sin((x / len) * Math.PI * 2 + t * speed + phase) + amp * 0.35 * Math.sin((x / (len * 0.45)) * Math.PI * 2 - t * speed * 1.3);
    d += ` L${x} ${y.toFixed(1)}`;
  }
  $(id).setAttribute("d", d + " L1920 380 Z");
}

window.render = function (t) {
  if (!S) return;
  const rough = { sunny: 0.5, fair: 0.7, changeable: 1, rough: 1.4, stormy: 1.9 }[S.data.weather] || 1;
  wave("p2", t, 30 * rough, 700, 1.1 * rough, 220, 0.4);
  wave("p1", t, 40 * rough, 560, 1.5 * rough, 270, 2.1);
  $("grid").style.transform = `translate(${-(t * 12) % 80}px, ${-(t * 5) % 80}px)`;
  renderScreens(t);
  let anyNarr = false;
  for (const seg of S.segments) {
    const on = t >= seg.start - 0.4 && t <= seg.end + 0.4;
    seg.el.style.display = on ? "block" : "none";
    if (!on) continue;
    const inP = outC(clamp((t - seg.start + 0.15) / 0.55));
    const outQ = seg.kind === "close" ? 0 : inC(clamp((t - (seg.end - 0.3)) / 0.45));
    seg.el.style.opacity = String(1 - outQ);
    seg.el.style.transform = `translateX(${-120 * outQ}px)`;
    seg.items.forEach((it, i) => {
      const p = outC(clamp((t - seg.start - 0.07 * i + 0.1) / 0.5));
      it.style.opacity = String(p);
      it.style.transform = it.classList.contains("zoom") ? `scale(${0.82 + 0.18 * p})`
        : it.classList.contains("frame") ? `scale(${0.9 + 0.1 * p})` : `translateY(${50 * (1 - p)}px)`;
    });
    if (seg.who === "narr" && seg.kind !== "close" && seg.kind !== "intro" && t >= seg.start && t <= seg.end) anyNarr = true;
  }
  $("foot").style.opacity = anyNarr ? "1" : "0";
  const last = S.segments[S.segments.length - 1];
  const first = S.segments[0];
  const opening = first.kind === "intro" && t < first.end;
  $("top").style.opacity = t < last.start && !opening ? "1" : "0";
};
</script></body></html>
