window.funnelStages = function funnelStages(component) {
  component.__redraw = () => funnelStages(component);
  const { data, setTriggerValue, parentElement } = component;
  const T = (s, v) => { const src = (typeof data === 'object' && data) || (typeof component === 'object' && component && component.data) || {}; const tr = (src && src.tr) || {}; let w = tr[s] || s; return v ? w.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)) : w; };
  const state = data || {};
  const lib = state.library || {sets: [], perspectives: []};
  const stages = state.stages || [];
  const scope = state.scope || "f";
  window.__funSel = window.__funSel || {};
  let sel = window.__funSel[scope];
  if (sel === undefined || sel === null || sel >= stages.length) sel = null;

  Array.from(parentElement.children).filter((c) => c.classList && c.classList.contains("lat")).forEach((c) => c.remove());
  const ro = !!state.readonly;            // a provided funnel: shown the same way, nothing can be changed
  const root = el("div", "lat prism fun" + (ro ? " ro" : ""));
  parentElement.appendChild(root);

  function addSplitter(root, lib, mid) {
    const KEY = "angLatLibW";
    // The Checks / "What this returns" columns under the editor follow the same divider (a page-wide variable).
    if (!document.getElementById("ang-lat-split-style")) {
      const st = document.createElement("style");
      st.id = "ang-lat-split-style";
      st.textContent = "@media (min-width: 641px){" +
        "[class*='st-key-lat_checks_'] [data-testid='stHorizontalBlock'] > [data-testid='stColumn']:first-child" +
        "{flex:0 0 var(--lat-lib-w, 260px) !important;width:var(--lat-lib-w, 260px) !important;min-width:0 !important}" +
        "[class*='st-key-lat_checks_'] [data-testid='stHorizontalBlock'] > [data-testid='stColumn']:nth-child(2)" +
        "{flex:1 1 0 !important;width:auto !important;min-width:0 !important}}";
      document.head.appendChild(st);
    }
    const share = () => {
      const w = Math.round(lib.getBoundingClientRect().width);
      if (w > 0) document.documentElement.style.setProperty("--lat-lib-w", w + "px");
    };
    try { const w = parseInt(window.localStorage.getItem(KEY) || "", 10); if (w) root.style.setProperty("--lib-w", w + "px"); } catch (e) {}
    requestAnimationFrame(share);
    const bar = document.createElement("div");
    bar.className = "split";
    bar.title = T("Drag to make this panel wider or narrower (double-click to reset)");
    bar.setAttribute("role", "separator");
    bar.setAttribute("aria-orientation", "vertical");
    root.insertBefore(bar, mid);
    bar.addEventListener("pointerdown", (ev) => {

    if (i < n - 1) ctl.appendChild(button("↓", T("Move this stage down"), () => { window.__funSel[scope] = null; act("move", {stage: i, dir: 1}); }));
    if (n > (state.min_stages || 3)) ctl.appendChild(button("✖", T("Remove this stage"), () => { window.__funSel[scope] = null; act("remove", {stage: i}); }, "del"));
    top.appendChild(ctl);
    }
    card.appendChild(top);
    if (st.question) {                       // the stage's question in plain words, and what passing it makes an asset
      const q = el("div", "q");
      q.appendChild(el("span", "qq", st.question));
      if (st.outcome) q.appendChild(el("span", "qo", "→ " + st.outcome));
      card.appendChild(q);
    }
    const row = el("div", "setrow");
    const nm = el("span", "setnm", st.set_name || T("No Set"));
    if (st.set_line) nm.title = st.set_line;
    row.appendChild(nm);
    const pv = el("span", "pv");
    (st.icons || []).forEach((p) => { const x = el("span", "", p.icon); x.title = p.hover; x.setAttribute("aria-label", p.hover); pv.appendChild(x); });
    row.appendChild(pv);
    if (st.upgrade && !ro) {
      const up = button(st.upgrade, T("Use the newer version of this Set. Saving then starts every asset again."),
                        () => act("upgrade", {stage: i}), "pill upd");
      row.appendChild(up);
    }
    card.appendChild(row);
    box.appendChild(card);
  });
  if (!full && !ro) {
    const add = el("div", "addstage", T("➕ Drop a Set here to add a stage"));
    add.title = T("Or tap + on a Set with no stage selected");
    dropZone(add, (key) => act("add", {set: key}));
    box.appendChild(add);
  }
  const spout = el("div", "spout", T("✅ Candidates"));
  spout.title = T("Assets that hold every stage");
  box.appendChild(spout);
}
